<svg width="880" height="250" viewBox="0 0 880 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Slate Base Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="880" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0D1424" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Amber Top Accent Beam -->
    <linearGradient id="amberBeam" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0" />
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#D97706" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Radial Glow Behind Node Map -->
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Engineering Grid -->
    <pattern id="techGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Main Card Frame -->
  <rect width="880" height="250" rx="16" fill="url(#bgGrad)" />
  <rect width="880" height="250" rx="16" fill="url(#techGrid)" />
  <rect x="0.75" y="0.75" width="878.5" height="248.5" rx="15.25" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top Accent Line -->
  <rect x="48" y="0" width="784" height="2" fill="url(#amberBeam)" />

  <!-- HUD Corner Brackets -->
  <path d="M 18 36 L 18 18 L 36 18" stroke="#D97706" stroke-width="2" stroke-linecap="round" />
  <path d="M 862 36 L 862 18 L 844 18" stroke="#D97706" stroke-width="2" stroke-linecap="round" />
  <path d="M 18 214 L 18 232 L 36 232" stroke="#D97706" stroke-width="2" stroke-linecap="round" />
  <path d="M 862 214 L 862 232 L 844 232" stroke="#D97706" stroke-width="2" stroke-linecap="round" />

  <!-- LEFT PANEL: IDENTITY & TELEMETRY -->
  <!-- Live Status Indicator -->
  <circle cx="44" cy="42" r="4.5" fill="#10B981">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="44" cy="42" r="8" stroke="#10B981" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="4.5;11;4.5" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <text x="60" y="46" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" letter-spacing="1.4">
    ONLINE // IZMIR, TR (UTC+3)
  </text>

  <!-- Main Name & Title -->
  <text x="40" y="102" fill="#F8FAFC" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">
    MOOSA
  </text>
  <rect x="218" y="88" width="10" height="14" rx="2" fill="#F59E0B">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
  </rect>

  <text x="42" y="132" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="600" letter-spacing="0.5">
    AI SYSTEMS ARCHITECT & FULL-STACK SAAS BUILDER
  </text>
  <text x="42" y="158" fill="#CBD5E1" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14.5">
    Engineering real-time computer vision, zero-trust ledgers & autonomous agents.
  </text>

  <!-- Active Domain Pills -->
  <rect x="42" y="182" width="136" height="28" rx="6" fill="#0F172A" stroke="#D97706" stroke-opacity="0.7" />
  <text x="110" y="200" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">
    S.A.F VISION
  </text>

  <rect x="190" y="182" width="144" height="28" rx="6" fill="#0F172A" stroke="#334155" />
  <text x="262" y="200" text-anchor="middle" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
    SILO BREAKER
  </text>

  <rect x="346" y="182" width="152" height="28" rx="6" fill="#0F172A" stroke="#334155" />
  <text x="422" y="200" text-anchor="middle" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5">
    FINTECH & MCP
  </text>

  <!-- Vertical Divider -->
  <line x1="530" y1="34" x2="530" y2="216" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />

  <!-- RIGHT PANEL: ANIMATED ARCHITECTURE NODE SCHEMATIC -->
  <circle cx="695" cy="125" r="115" fill="url(#coreGlow)" />

  <!-- Orbit Rings -->
  <circle cx="695" cy="125" r="78" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 5" />
  <circle cx="695" cy="125" r="46" stroke="#D97706" stroke-opacity="0.3" stroke-width="1" />

  <!-- Connecting Telemetry Lines -->
  <line x1="695" y1="125" x2="605" y2="62" stroke="#334155" stroke-width="1.5" />
  <line x1="695" y1="125" x2="792" y2="68" stroke="#334155" stroke-width="1.5" />
  <line x1="695" y1="125" x2="605" y2="188" stroke="#334155" stroke-width="1.5" />
  <line x1="695" y1="125" x2="792" y2="184" stroke="#334155" stroke-width="1.5" />

  <!-- Animated Data Packets Traveling to Core -->
  <circle r="3" fill="#F59E0B">
    <animate attributeName="cx" values="605;695" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="cy" values="62;125" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#10B981">
    <animate attributeName="cx" values="792;695" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="68;125" dur="2.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#38BDF8">
    <animate attributeName="cx" values="605;695" dur="2.6s" repeatCount="indefinite" />
    <animate attributeName="cy" values="188;125" dur="2.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#F59E0B">
    <animate attributeName="cx" values="792;695" dur="3.1s" repeatCount="indefinite" />
    <animate attributeName="cy" values="184;125" dur="3.1s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite" />
  </circle>

  <!-- Satellite Node 1: Top Left (FastAPI / Python) -->
  <rect x="556" y="44" width="96" height="28" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.65" />
  <text x="604" y="62" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">
    FASTAPI · PY
  </text>

  <!-- Satellite Node 2: Top Right (Next.js / TS) -->
  <rect x="742" y="50" width="98" height="28" rx="6" fill="#0F172A" stroke="#10B981" stroke-opacity="0.65" />
  <text x="791" y="68" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">
    NEXT.JS · TS
  </text>

  <!-- Satellite Node 3: Bottom Left (Neon / Vector) -->
  <rect x="556" y="174" width="96" height="28" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.65" />
  <text x="604" y="192" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">
    NEON · RAG
  </text>

  <!-- Satellite Node 4: Bottom Right (AWS / Docker) -->
  <rect x="742" y="170" width="98" height="28" rx="6" fill="#0F172A" stroke="#94A3B8" stroke-opacity="0.55" />
  <text x="791" y="188" text-anchor="middle" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">
    AWS · DOCKER
  </text>

  <!-- Central Core Hub -->
  <rect x="652" y="106" width="86" height="38" rx="8" fill="#090D16" stroke="#F59E0B" stroke-width="1.8" />
  <text x="695" y="123" text-anchor="middle" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.8">
    AI ENGINE
  </text>
  <text x="695" y="136" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9">
    v2026.11
  </text>
</svg>
