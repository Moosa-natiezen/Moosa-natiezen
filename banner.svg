<svg width="880" height="240" viewBox="0 0 880 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes glow { 0%, 100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 0.95; } }
  </style>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="880" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="amberBeam" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="880" height="240" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="878" height="238" rx="15" stroke="#1E293B" stroke-width="1.5" />
  <rect x="48" y="0" width="784" height="2.5" fill="url(#amberBeam)" />

  <!-- Corner HUD Brackets -->
  <path d="M 18 36 L 18 18 L 36 18" stroke="#D97706" stroke-width="2" stroke-linecap="round" />
  <path d="M 862 36 L 862 18 L 844 18" stroke="#D97706" stroke-width="2" stroke-linecap="round" />
  <path d="M 18 204 L 18 222 L 36 222" stroke="#D97706" stroke-width="2" stroke-linecap="round" />
  <path d="M 862 204 L 862 222 L 844 222" stroke="#D97706" stroke-width="2" stroke-linecap="round" />

  <!-- Status Telemetry -->
  <circle cx="44" cy="40" r="4.5" fill="#10B981" class="pulse" />
  <text x="58" y="44" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="1.4">
    ONLINE // IZMIR, TR (UTC+3)
  </text>

  <!-- Identity -->
  <text x="40" y="98" fill="#F8FAFC" font-family="sans-serif" font-size="44" font-weight="800">
    MOOSA
  </text>
  <rect x="218" y="84" width="10" height="14" rx="2" fill="#F59E0B" class="blink" />

  <text x="42" y="128" fill="#FBBF24" font-family="monospace" font-size="13.5" font-weight="700">
    AI SYSTEMS ARCHITECT & FULL-STACK SAAS BUILDER
  </text>
  <text x="42" y="154" fill="#CBD5E1" font-family="sans-serif" font-size="14.5">
    Engineering real-time computer vision, zero-trust ledgers & autonomous agents.
  </text>

  <!-- Domain Badges -->
  <rect x="42" y="176" width="136" height="28" rx="6" fill="#090D16" stroke="#D97706" />
  <text x="110" y="194" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="11.5" font-weight="700">
    S.A.F VISION
  </text>

  <rect x="190" y="176" width="144" height="28" rx="6" fill="#090D16" stroke="#334155" />
  <text x="262" y="194" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="11.5">
    SILO BREAKER
  </text>

  <rect x="346" y="176" width="152" height="28" rx="6" fill="#090D16" stroke="#334155" />
  <text x="422" y="194" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="11.5">
    FINTECH & AWS
  </text>

  <!-- Divider -->
  <line x1="530" y1="32" x2="530" y2="208" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Right Panel: Architecture Topology -->
  <circle cx="695" cy="120" r="76" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 5" />
  <circle cx="695" cy="120" r="48" stroke="#D97706" stroke-width="1.2" class="glow" />

  <line x1="695" y1="120" x2="604" y2="56" stroke="#334155" stroke-width="1.5" />
  <line x1="695" y1="120" x2="791" y2="60" stroke="#334155" stroke-width="1.5" />
  <line x1="695" y1="120" x2="604" y2="184" stroke="#334155" stroke-width="1.5" />
  <line x1="695" y1="120" x2="791" y2="180" stroke="#334155" stroke-width="1.5" />

  <!-- Satellite Nodes -->
  <rect x="556" y="40" width="96" height="28" rx="6" fill="#090D16" stroke="#F59E0B" />
  <text x="604" y="58" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="10.5">
    FASTAPI · PY
  </text>

  <rect x="742" y="44" width="98" height="28" rx="6" fill="#090D16" stroke="#10B981" />
  <text x="791" y="62" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="10.5">
    NEXT.JS · TS
  </text>

  <rect x="556" y="170" width="96" height="28" rx="6" fill="#090D16" stroke="#38BDF8" />
  <text x="604" y="188" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="10.5">
    NEON · RAG
  </text>

  <rect x="742" y="166" width="98" height="28" rx="6" fill="#090D16" stroke="#94A3B8" />
  <text x="791" y="184" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="10.5">
    AWS · DOCKER
  </text>

  <!-- Core Hub -->
  <rect x="652" y="101" width="86" height="38" rx="8" fill="#090D16" stroke="#F59E0B" stroke-width="1.8" />
  <text x="695" y="118" text-anchor="middle" fill="#FBBF24" font-family="monospace" font-size="10" font-weight="700">
    AI ENGINE
  </text>
  <text x="695" y="131" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">
    v2026.11
  </text>
</svg>
